{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<form method="POST">

    <label>Username</label>

    <br><br>

    <input
        type="text"
        name="username"
        required>

    <br><br>

    <p>
    Don't have an account?
    <a href="{{ url_for('main.register') }}">Register</a>
    </p>

    <button type="submit">
        Login
    </button>

</form>

{% endblock %}
