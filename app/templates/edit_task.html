{% extends "base.html" %}

{% block content %}

<h2>Edit Task</h2>

<form method="POST">

<label>Title</label>

<br>

<input
    type="text"
    name="title"
    value="{{ task.title }}"
    required>

<br><br>

<label>Description</label>

<br>

<textarea
    name="description"
    rows="5"
    cols="40">{{ task.description }}</textarea>

<br><br>

<button type="submit">

Update Task

</button>

</form>

{% endblock %}
