{% extends "base.html" %}

{% block content %}

<h2>My Tasks</h2>

{% if tasks %}

<ul>


{% for task in tasks %}

<li>

    <b>{{ task.title }}</b>

    <br>

    {{ task.description }}

    <br><br>

    <a href="{{ url_for('main.edit_task', task_id=task.id) }}">
        Edit
    </a>

    |

    <a href="{{ url_for('main.delete_task', task_id=task.id) }}">
        Delete
    </a>

</li>

<br>

{% endfor %}

</ul>

{% else %}

<p>No tasks found.</p>

{% endif %}

{% endblock %}
