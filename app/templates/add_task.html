{% extends "base.html" %}

{% block content %}

<h2>Add New Task</h2>

<form method="POST">

    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label>Title</label><br>
    <input
        type="text"
        name="title"
        required>

    <br><br>

    <label>Description</label><br>
    <textarea
        name="description"
        rows="5"
        cols="40"></textarea>

    <br><br>

    <button type="submit">
        Save Task
    </button>

</form>

{% endblock %}
