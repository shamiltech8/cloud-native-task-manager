{% extends "base.html" %}

{% block content %}

<h2>Add Task</h2>

<form method="POST">

    <label>Task Name:</label>

    <br><br>

    <input
        type="text"
        name="task"
        placeholder="Enter task"
        required>

    <br><br>

    <button type="submit">
        Add Task
    </button>

</form>

{% endblock %}
