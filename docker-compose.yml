services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: always

    environment:
      POSTGRES_USER: ${DB_USER:?Set DB_USER in .env}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-task_manager}

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U task_user -d task_manager"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

    ports:
      - "5432:5432"

    volumes:
      - postgres-data:/var/lib/postgresql/data

    networks:
      - app-network


  flask1:
    build: .
    container_name: flask1
    restart: always

    depends_on:
      - postgres

    expose:
      - "5000"

    environment:
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-task_manager}

    networks:
      - app-network


  flask2:
    build: .
    container_name: flask2
    restart: always

    depends_on:
      - postgres

    expose:
      - "5000"

    environment:
     DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-task_manager}

    networks:
      - app-network


  flask3:
    build: .
    container_name: flask3
    restart: always

    depends_on:
      - postgres

    expose:
      - "5000"

    environment:
      DATABASE_URL: postgresql://${DB_USER:?Set DB_USER in .env}:${DB_PASSWORD:?Set DB_PASSWORD in .env}@postgres:5432/${DB_NAME:-task_manager}

    networks:
      - app-network

  nginx:
    image: nginx:latest
    container_name: nginx
    restart: always

    depends_on:
      - flask1
      - flask2
      - flask3

    ports:
      - "80:80"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./app/static:/app/app/static:ro

    networks:
      - app-network


volumes:
  postgres-data:


networks:
  app-network:
    driver: bridge

